<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-label="Canonical history on the left is projected into model-visible context on the right: commit keeps the body, compact replaces it with a summary, squash with a result, revert with a carryforward only.">
  <title>pi-memento: canonical history vs model-visible context</title>
  <defs>
    <marker id="ar-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker>
    <marker id="ar-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker>
    <marker id="ar-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d29922"/></marker>
    <marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e5697d"/></marker>
  </defs>

  <!-- headings -->
  <text x="60" y="44" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="600" fill="#c9d1d9">Canonical history</text>
  <text x="60" y="64" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#8b949e">append-only session log, never rewritten</text>
  <text x="600" y="44" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="600" fill="#c9d1d9">Model-visible context</text>
  <text x="600" y="64" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#8b949e">the projection the model sees next turn</text>

  <!-- left: opening message -->
  <rect x="60" y="90" width="300" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="72" y="107" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#c9d1d9">user: reverse the frame format</text>

  <!-- span 1 · commit -->
  <rect x="60" y="126" width="300" height="92" rx="7" fill="none" stroke="#3fb950" stroke-width="1.3"/>
  <text x="72" y="142" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#3fb950">begin · locate the parser</text>
  <rect x="72" y="150" width="276" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="82" y="167" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#c9d1d9">grep xrefs for read()</text>
  <rect x="72" y="184" width="276" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="82" y="201" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#c9d1d9">found frame_read() in io.c</text>

  <!-- span 2 · compact -->
  <rect x="60" y="228" width="300" height="92" rx="7" fill="none" stroke="#58a6ff" stroke-width="1.3"/>
  <text x="72" y="244" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#58a6ff">begin · map the header</text>
  <rect x="72" y="252" width="276" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="82" y="269" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#c9d1d9">probe fields byte by byte</text>
  <rect x="72" y="286" width="276" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="82" y="303" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#c9d1d9">dump 40 frames, compare</text>

  <!-- span 3 · squash -->
  <rect x="60" y="330" width="300" height="92" rx="7" fill="none" stroke="#d29922" stroke-width="1.3"/>
  <text x="72" y="346" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#d29922">begin · test a checksum idea</text>
  <rect x="72" y="354" width="276" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="82" y="371" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#c9d1d9">try crc16 over the payload</text>
  <rect x="72" y="388" width="276" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="82" y="405" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#c9d1d9">matches on every frame</text>

  <!-- span 4 · revert -->
  <rect x="60" y="432" width="300" height="92" rx="7" fill="none" stroke="#e5697d" stroke-width="1.3"/>
  <text x="72" y="448" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#e5697d">begin · is field 3 a length?</text>
  <rect x="72" y="456" width="276" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="82" y="473" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#c9d1d9">fuzz field 3, watch parser</text>
  <rect x="72" y="490" width="276" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="82" y="507" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#c9d1d9">no effect on framing</text>

  <!-- left: closing message -->
  <rect x="60" y="534" width="300" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="72" y="551" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#c9d1d9">work continues&#8230;</text>

  <!-- arrows -->
  <line x1="368" y1="172" x2="588" y2="172" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ar-c)"/>
  <text x="478" y="162" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#3fb950">commit</text>
  <text x="478" y="188" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#8b949e">kept inline</text>

  <line x1="368" y1="274" x2="588" y2="274" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ar-p)"/>
  <text x="478" y="264" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#58a6ff">compact</text>
  <text x="478" y="290" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#8b949e">model-written summary</text>

  <line x1="368" y1="376" x2="588" y2="376" stroke="#d29922" stroke-width="1.5" marker-end="url(#ar-s)"/>
  <text x="478" y="366" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#d29922">squash</text>
  <text x="478" y="392" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#8b949e">agent-written result</text>

  <line x1="368" y1="478" x2="588" y2="478" stroke="#e5697d" stroke-width="1.5" marker-end="url(#ar-r)"/>
  <text x="478" y="468" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#e5697d">revert</text>
  <text x="478" y="494" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#8b949e">lesson only</text>

  <!-- right: opening message -->
  <rect x="600" y="90" width="300" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="612" y="107" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#c9d1d9">user: reverse the frame format</text>

  <!-- commit: body kept -->
  <rect x="600" y="142" width="300" height="26" rx="5" fill="#14261b" stroke="#3fb950"/>
  <text x="612" y="159" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#c9d1d9">grep xrefs for read()</text>
  <rect x="600" y="176" width="300" height="26" rx="5" fill="#14261b" stroke="#3fb950"/>
  <text x="612" y="193" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#c9d1d9">found frame_read() in io.c</text>

  <!-- compact: summary -->
  <rect x="600" y="261" width="300" height="26" rx="5" fill="#101f33" stroke="#58a6ff"/>
  <text x="612" y="278" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#c9d1d9">summary · header: magic, seq, len</text>

  <!-- squash: result -->
  <rect x="600" y="363" width="300" height="26" rx="5" fill="#271f0d" stroke="#d29922"/>
  <text x="612" y="380" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#c9d1d9">result · checksum is CRC-16/X25</text>

  <!-- revert: carryforward -->
  <rect x="600" y="458" width="300" height="40" rx="5" fill="#2b141a" stroke="#e5697d" stroke-dasharray="5 3"/>
  <text x="612" y="474" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#c9d1d9">carryforward · field 3 is not a</text>
  <text x="612" y="490" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#c9d1d9">length, do not revisit</text>

  <!-- right: closing message -->
  <rect x="600" y="534" width="300" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="612" y="551" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#c9d1d9">work continues, context clean</text>

  <!-- caption -->
  <text x="480" y="600" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#8b949e">The projection is a view. History is never rewritten.</text>
</svg>
